name: build-app
# בונה את app/ כדי שיהיה קישור למיזוג האחרון גם בלי Vercel:
# https://raw.githack.com/Anat1969/pro-metrics-vue-GH/main/app/index.html
on:
  push:
    branches: [main]
    paths-ignore: ['app/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build:github
      - name: Commit app/ if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then echo "app/ unchanged"; exit 0; fi
          git commit -m "build: app/ for the raw.githack link"
          git push
